global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: watchdog_api
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000

  - job_name: watchdog_pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
