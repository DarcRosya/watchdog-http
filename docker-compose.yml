services:
  database:
    image: timescale/timescaledb:latest-pg14
    container_name: watchdog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASS}
      POSTGRES_DB: ${DB__NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: watchdog_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    container_name: watchdog_migrator
    command: alembic -c alembic.ini upgrade head
    restart: "no"
    env_file:
      - .env
    environment:
      - DB__HOST=database
    depends_on:
      database:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    container_name: watchdog_app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DB__HOST: database
      REDIS__R_HOST: redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  scheduler-worker:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    container_name: watchdog_scheduler_worker
    command: arq src.worker.scheduler.SchedulerWorkerSettings
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__HOST: database
      REDIS__R_HOST: redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  monitoring-worker:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    # container_name: watchdog_monitoring_worker
    command: arq src.worker.monitoring.MonitoringWorkerSettings
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__HOST: database
      REDIS__R_HOST: redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 128M


  alerting-worker:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    container_name: watchdog_alerting_worker
    command: arq src.worker.alerting.AlertingWorkerSettings
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__HOST: database
      REDIS__R_HOST: redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  telegram-bot:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    container_name: watchdog_telegram
    command: python -m src.telegram.bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB__HOST: database
      REDIS__R_HOST: redis
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

  nginx:
    build: ./nginx
    container_name: watchdog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          memory: 16M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: watchdog_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
      - pushgateway
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M

  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: watchdog_pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

  grafana:
    image: grafana/grafana:11.2.2
    container_name: watchdog_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
