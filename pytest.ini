[pytest]
minversion = 6.0

# Where to look for tests
testpaths = tests

# Python path for importing modules
pythonpath = src

# Pattern for searching for test files
python_files = test_*.py

# Pattern for test classes
python_classes = Test*

# Pattern for test functions
python_functions = test_*

# Asyncio mode (for async tests)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

env_files = .env.test

# Default options for pytest
addopts =
    # Detailed output
    -v
    # Show local variables when a test fails
    -l
    # Show a short but informative traceback
    --tb=short
    # Show a summary at the end
    -ra
    # Do not show warnings (can be enabled for debugging)
    --disable-warnings
    # Strict markers mode (all markers must be declared)
    --strict-markers
    # Show execution time of slowest tests
    --durations=10
    # Colored output
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (with real database and Redis)
    api: API endpoint tests (testing HTTP endpoints)
    repository: Repository layer tests
    service: Service layer tests
    slow: Slow tests
    skip_ci: Skip in CI/CD

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Logging to file is disabled - we use structlog in conftest.py
# log_file = tests/logs/pytest.log
# log_file_level = DEBUG
# log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s (%(filename)s:%(lineno)d)
# log_file_date_format = %Y-%m-%d %H:%M:%S

# Filters for warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
