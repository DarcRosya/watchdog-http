name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: make install

      - name: Check code formatting
        run: poetry run black --check src tests scripts

      - name: Run linters
        run: make lint

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchdog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchdog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-test-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-test-

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        env:
          DB__USER: postgres
          DB__PASS: postgres
          DB__HOST: localhost
          DB__PORT: "5432"
          DB__NAME: watchdog_test
          REDIS__HOST: localhost
          REDIS__PORT: "6379"
          TELEGRAM__BOT_TOKEN: "dummy_token_for_ci_tests"
        run: poetry run pytest tests -m "not skip_ci"

  version-sync-check:
    name: Version Sync Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version consistency
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "Main version: $VERSION"

          if ! grep -Eq "version\s*=\s*\"$VERSION\"" src/main.py; then
            echo "Version mismatch in src/main.py"
            exit 1
          fi

          if ! grep -q "badge/version-$VERSION-" README.md; then
            echo "Version mismatch in README.md badge"
            exit 1
          fi

          echo "✓ Version check passed"

  docker-build:
    name: Docker Build Test
    needs: [lint-and-check, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: make docker-build
